<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demand Decision Center</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #6c5ce7;
            --accent-gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --text-main: #ffffff;
            --text-dim: #888;
            --plan-bar: rgba(108, 92, 231, 0.2);
            --real-bar: #6c5ce7;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #1e1e2f, #0a0a0f);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0; 
            height: 100%;
            display: flex; flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .top-region { flex-shrink: 0; padding: 0 15px; z-index: 30; }
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0 15px 80px; /* 增加底部填充，防止被footer遮挡最后的内容 */
            -webkit-overflow-scrolling: touch; 
        }

        .header { 
            position: relative; text-align: center; margin: 0 0 20px; padding-top: 45px; 
        }
        .header h1 { 
            font-weight: 200; letter-spacing: 5px; text-transform: uppercase; font-size: 16px; margin: 0; opacity: 0.8;
        }
        
        .lang-toggle {
            position: absolute; top: 10px; right: 0px; font-size: 10px; background: transparent;
            border: 1px solid rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; 
            cursor: pointer; color: #fff; font-weight: 200; letter-spacing: 1px; z-index: 40;
        }

        .tab-bar {
            display: flex; background: var(--glass-bg); border-radius: 30px; padding: 5px;
            margin-bottom: 20px; border: 1px solid var(--glass-border);
        }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 11px; letter-spacing: 1px; border-radius: 25px; cursor: pointer; }
        .tab.active { background: var(--accent); color: #fff; }

        .card {
            background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; margin-bottom: 15px;
        }

        /* 甘特图样式 */
        .gantt-outer { overflow-x: auto; background: var(--glass-bg); border-radius: 15px; border: 1px solid var(--glass-border); padding: 10px; position: relative; }
        .gantt-container { display: flex; flex-direction: column; }
        .gantt-header-block { position: sticky; top: 0; background: #15151e; z-index: 5; margin-bottom: 10px; }
        .gantt-header-row { display: flex; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }
        .gantt-month-label { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; padding-left: 5px; border-left: 1px solid var(--glass-border); flex-shrink: 0; }
        .gantt-week-row { display: flex; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }
        .gantt-week-label { text-align: center; font-size: 8px; color: var(--text-dim); border-left: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        
        .gantt-row { display: flex; margin-bottom: 12px; align-items: center; }
        .gantt-info { 
            width: 80px; flex-shrink: 0; font-size: 10px; padding-right: 10px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            position: sticky; left: 0; background: #15151e; z-index: 2; /* 冻结列 */
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
        }
        .gantt-track { flex-grow: 1; position: relative; height: 18px; background: rgba(255,255,255,0.02); border-radius: 4px; }
        .bar-plan { position: absolute; height: 5px; top: 3px; border-radius: 3px; }
        .bar-real { position: absolute; height: 5px; top: 10px; border-radius: 3px; }

        .input-group { margin-bottom: 15px; }
        label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); display: block; margin-bottom: 6px; }
        input, textarea, select {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 10px; color: #fff; width: 100%; box-sizing: border-box; outline: none; font-size: 13px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .project-item { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid var(--glass-border); 
            border-radius: 15px; 
            padding: 15px; 
            margin-bottom: 12px; 
            position: relative; 
        }
        /* 顶部左侧选色小圆点 */
        .color-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .score-display { font-size: 22px; font-weight: 100; color: var(--text-dim); position: absolute; top: 15px; right: 15px; }
        .p-name { font-size: 15px; font-weight: 400; margin-bottom: 8px; padding-right: 50px; padding-left: 10px; }
        .p-meta { font-size: 9px; color: var(--text-dim); padding-left: 10px; }

        /* 全色盘小圆点 */
        .color-dot-picker { 
            width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; 
            position: relative; display: inline-block;
            background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
        }
        .color-input-hidden { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 100; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .btn { background: var(--accent-gradient); border: none; color: #fff; padding: 14px; width: 100%; border-radius: 12px; letter-spacing: 1px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }
        
        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            text-align: center; 
            font-size: 10px; 
            color: #666; 
            padding: 15px; 
            line-height: 1.6;
            background: #0a0a0f; 
            border-top: 1px solid var(--glass-border);
            z-index: 50; 
        }
        .footer a { color: var(--accent); text-decoration: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="top-region">
        <div class="lang-toggle" onclick="toggleLang()" id="langBtn">EN / 中</div>
        <div class="header"><h1 data-i18n="title">Demand Decision Center</h1></div>
        <div class="tab-bar">
            <div class="tab active" onclick="switchView('decide')" data-i18n="tabDecide">DECISION</div>
            <div class="tab" onclick="switchView('gantt')" data-i18n="tabGantt">TIMELINE</div>
        </div>
    </div>

    <div class="main-content">
        <div id="decideView">
            <div class="card">
                <label data-i18n="quickEntry">Quick Objective</label>
                <input type="text" id="quickName" placeholder="..." style="margin-bottom:10px;">
                <button class="btn" onclick="quickAdd()" data-i18n="btnInit">Initialize Entry</button>
            </div>
            <div id="projectList"></div>
        </div>

        <div id="ganttView" style="display:none;">
            <div class="gantt-outer">
                <div class="gantt-container" id="ganttContainer">
                    <div class="gantt-header-block">
                        <div class="gantt-header-row" id="ganttMonths"></div>
                        <div class="gantt-week-row" id="ganttWeeks"></div>
                    </div>
                    <div id="ganttRows"></div>
                </div>
            </div>
            <p style="font-size:8px; color:#555; margin-top:10px;" data-i18n="ganttHint">* Light bar: Plan | Dark bar: Real</p>
        </div>
    </div>

    <div class="footer">
        Copyright © 2026 吕滢 | GitHub: <a href="https://github.com/lveyond" target="_blank">@lveyond</a><br>
        QQ/WeChat: 329613507 | 仅限个人使用，非授权不得商用
    </div>

    <div id="modalOverlay">
        <div class="card">
            <div class="input-group">
                <div class="flex-between">
                    <label data-i18n="pNameLabel">Objective Name</label>
                    <div class="color-dot-picker" id="mColorDot">
                        <input type="color" id="mColorInput" class="color-input-hidden" oninput="updateProjColor(this.value)">
                    </div>
                </div>
                <input type="text" id="mName" style="font-size: 16px; font-weight: bold; border-color: var(--accent); margin-top:5px;">
            </div>
            <div class="grid-2">
                <div class="input-group"><label data-i18n="owner1">Owner 1</label><input type="text" id="mOwner1"></div>
                <div class="input-group"><label data-i18n="owner2">Owner 2</label><input type="text" id="mOwner2"></div>
            </div>
            <div class="grid-2">
                <div class="input-group"><label data-i18n="pStart">Plan Start</label><input type="date" id="mPStart"></div>
                <div class="input-group"><label data-i18n="pEnd">Plan End</label><input type="date" id="mPEnd"></div>
            </div>
            <div class="grid-2">
                <div class="input-group"><label data-i18n="rStart">Real Start</label><input type="date" id="mRStart"></div>
                <div class="input-group"><label data-i18n="rEnd">Real End</label><input type="date" id="mREnd"></div>
            </div>
            <div class="input-group"><label data-i18n="desc">Description</label><textarea id="mDesc" rows="2"></textarea></div>
            <div class="grid-2">
                <div class="input-group"><label>Reach</label><input type="number" id="mReach"></div>
                <div class="input-group"><label>Impact</label><input type="number" id="mImpact" step="0.1"></div>
                <div class="input-group"><label>Conf %</label><input type="number" id="mConf"></div>
                <div class="input-group"><label>Effort</label><input type="number" id="mEffort"></div>
            </div>
            <div class="grid-2">
                <div class="input-group"><label>Boss (1-10)</label><input type="number" id="mBoss"></div>
                <div class="input-group"><label>Tech (1-10)</label><input type="number" id="mTech"></div>
            </div>
            <button class="btn" onclick="saveDetails()" data-i18n="btnCommit">Commit</button>
            <button class="btn btn-ghost" onclick="duplicateProject()" data-i18n="btnDuplicate">Duplicate Card</button>
            <button class="btn btn-ghost" onclick="closeModal()" data-i18n="btnDismiss">Dismiss</button>
            <button class="btn" style="background:#422; margin-top:20px; font-size:12px;" onclick="deleteProject()" data-i18n="btnDelete">Delete Record</button>
        </div>
    </div>

    <script>
        const i18n = {
            zh: {
                title: "需求决策中心", tabDecide: "决策墙", tabGantt: "时间轴", quickEntry: "快速录入目标", btnInit: "初始化需求",
                owner1: "第一负责人", owner2: "第二负责人", pStart: "计划开始", pEnd: "计划结束", rStart: "实际开始", rEnd: "实际结束",
                desc: "项目描述", btnCommit: "提交更改", btnDismiss: "返回", btnDelete: "彻底删除",
                ganttHint: "* 浅色条: 计划 | 深色条: 实际", ownerLabel: "负责人", dueLabel: "截止", 
                week: "第", weekSuffix: "周", pNameLabel: "需求名称 (可修改)", btnDuplicate: "复制并新增卡片"
            },
            en: {
                title: "Demand Decision Center", tabDecide: "DECISION", tabGantt: "TIMELINE", quickEntry: "Quick Objective", btnInit: "Initialize Entry",
                owner1: "Owner 1", owner2: "Owner 2", pStart: "Plan Start", pEnd: "Plan End", rStart: "Real Start", rEnd: "Real End",
                desc: "Description", btnCommit: "Commit Changes", btnDismiss: "Dismiss", btnDelete: "Delete",
                ganttHint: "* Light bar: Plan | Dark bar: Real", ownerLabel: "OWNER", dueLabel: "DUE", 
                week: "W", weekSuffix: "", pNameLabel: "Objective Name (Editable)", btnDuplicate: "Duplicate Card"
            }
        };

        const DEFAULT_COLOR = '#6c5ce7';
        let currentLang = localStorage.getItem('pm_lang') || 'en';
        let projects = JSON.parse(localStorage.getItem('pm_pro_v6')) || [];
        let editingId = null;
        let selectedProjColor = DEFAULT_COLOR;

        function updateProjColor(val) {
            selectedProjColor = val;
            document.getElementById('mColorDot').style.background = val;
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('pm_lang', currentLang);
            applyLang();
            renderDecide();
        }

        function applyLang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = i18n[currentLang][key];
            });
        }

        function switchView(view) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.tab');
            if(view === 'decide') tabs[0].classList.add('active'); else tabs[1].classList.add('active');
            document.getElementById('decideView').style.display = view === 'decide' ? 'block' : 'none';
            document.getElementById('ganttView').style.display = view === 'gantt' ? 'block' : 'none';
            if(view === 'gantt') renderGantt();
        }

        function quickAdd() {
            const name = document.getElementById('quickName').value;
            if(!name) return;
            const p = createProjectObj(name);
            projects.push(p);
            save();
            document.getElementById('quickName').value = '';
            renderDecide();
        }

        function createProjectObj(name) {
            return {
                id: Date.now(), name, owner1: '', owner2: '', pStart: '', pEnd: '', rStart: '', rEnd: '',
                desc: '', reach: 1000, impact: 1, conf: 100, effort: 5, boss: 1, tech: 1, score: 0,
                color: DEFAULT_COLOR
            };
        }

        function updateScore(p) {
            let base = (p.reach * p.impact * (p.conf / 100)) / (p.effort || 1);
            p.score = (base * (1 + (p.boss-1)*0.4) * (1 - (p.tech-1)*0.07)).toFixed(1);
        }

        function openDetails(id) {
            editingId = id;
            const p = projects.find(x => x.id === id);
            document.getElementById('mName').value = p.name;
            document.getElementById('mOwner1').value = p.owner1;
            document.getElementById('mOwner2').value = p.owner2;
            document.getElementById('mPStart').value = p.pStart;
            document.getElementById('mPEnd').value = p.pEnd;
            document.getElementById('mRStart').value = p.rStart;
            document.getElementById('mREnd').value = p.rEnd;
            document.getElementById('mDesc').value = p.desc;
            document.getElementById('mReach').value = p.reach;
            document.getElementById('mImpact').value = p.impact;
            document.getElementById('mConf').value = p.conf;
            document.getElementById('mEffort').value = p.effort;
            document.getElementById('mBoss').value = p.boss;
            document.getElementById('mTech').value = p.tech;
            
            selectedProjColor = p.color || DEFAULT_COLOR;
            document.getElementById('mColorDot').style.background = (selectedProjColor === DEFAULT_COLOR) ? 'conic-gradient(red, yellow, lime, aqua, blue, magenta, red)' : selectedProjColor;
            document.getElementById('mColorInput').value = selectedProjColor;
            document.getElementById('modalOverlay').style.display = 'block';
        }

        function saveDetails() {
            const p = projects.find(x => x.id === editingId);
            p.name = document.getElementById('mName').value;
            p.owner1 = document.getElementById('mOwner1').value;
            p.owner2 = document.getElementById('mOwner2').value;
            p.pStart = document.getElementById('mPStart').value;
            p.pEnd = document.getElementById('mPEnd').value;
            p.rStart = document.getElementById('mRStart').value;
            p.rEnd = document.getElementById('mREnd').value;
            p.desc = document.getElementById('mDesc').value;
            p.reach = parseFloat(document.getElementById('mReach').value) || 0;
            p.impact = parseFloat(document.getElementById('mImpact').value) || 0;
            p.conf = parseFloat(document.getElementById('mConf').value) || 0;
            p.effort = parseFloat(document.getElementById('mEffort').value) || 1;
            p.boss = parseInt(document.getElementById('mBoss').value) || 1;
            p.tech = parseInt(document.getElementById('mTech').value) || 1;
            p.color = selectedProjColor;
            updateScore(p);
            save();
            renderDecide();
            closeModal();
        }

        function duplicateProject() {
            const source = projects.find(x => x.id === editingId);
            const copy = JSON.parse(JSON.stringify(source));
            copy.id = Date.now();
            copy.name = copy.name + " (Copy)";
            projects.push(copy);
            save();
            renderDecide();
            closeModal();
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        function deleteProject() {
            if(confirm('Delete?')) {
                projects = projects.filter(x => x.id !== editingId);
                save();
                renderDecide();
                closeModal();
            }
        }
        function save() {
            projects.sort((a,b) => b.score - a.score);
            localStorage.setItem('pm_pro_v6', JSON.stringify(projects));
        }
        function renderDecide() {
            const list = document.getElementById('projectList');
            const lang = i18n[currentLang];
            list.innerHTML = projects.map(p => {
                const hasCustomColor = p.color && p.color.toLowerCase() !== DEFAULT_COLOR.toLowerCase();
                return `
                    <div class="project-item" onclick="openDetails(${p.id})">
                        ${hasCustomColor ? `<div class="color-indicator" style="background:${p.color}"></div>` : ''}
                        <div class="score-display">${p.score}</div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-meta">${lang.ownerLabel}: ${p.owner1 || '-'} | ${lang.dueLabel}: ${p.pEnd || '-'}</div>
                    </div>
                `;
            }).join('');
        }

        function renderGantt() {
            const container = document.getElementById('ganttContainer');
            const monthsHeader = document.getElementById('ganttMonths');
            const weeksHeader = document.getElementById('ganttWeeks');
            const rowsContainer = document.getElementById('ganttRows');
            if(projects.length === 0) { rowsContainer.innerHTML = 'No Data'; return; }
            let minDate = new Date(); let maxDate = new Date();
            maxDate.setMonth(maxDate.getMonth() + 1);
            projects.forEach(p => {
                [p.pStart, p.pEnd, p.rStart, p.rEnd].forEach(dStr => {
                    if(!dStr) return;
                    const d = new Date(dStr);
                    if(d < minDate) minDate = new Date(d);
                    if(d > maxDate) maxDate = new Date(d);
                });
            });
            minDate = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
            maxDate = new Date(maxDate.getFullYear(), maxDate.getMonth() + 1, 0);
            const totalDays = Math.ceil((maxDate - minDate) / (1000*60*60*24)) + 1;
            const pxPerDay = 30;
            container.style.width = (80 + (totalDays * pxPerDay)) + "px"; // 调整基础宽度
            
            let monthHtml = '<div style="width:80px; flex-shrink:0;"></div>';
            let current = new Date(minDate);
            while(current <= maxDate) {
                const daysInMonth = new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate();
                const width = daysInMonth * pxPerDay;
                monthHtml += `<div class="gantt-month-label" style="width:${width}px">${current.getFullYear()}.${current.getMonth()+1}</div>`;
                current.setMonth(current.getMonth() + 1);
            }
            monthsHeader.innerHTML = monthHtml;
            
            let weekHtml = '<div style="width:80px; flex-shrink:0;"></div>';
            const totalWeeks = Math.ceil(totalDays / 7);
            for(let w=1; w<=totalWeeks; w++) {
                weekHtml += `<div class="gantt-week-label" style="width:${7 * pxPerDay}px">${i18n[currentLang].week}${w}${i18n[currentLang].weekSuffix}</div>`;
            }
            weeksHeader.innerHTML = weekHtml;
            
            rowsContainer.innerHTML = projects.map(p => {
                const getLeft = (dStr) => {
                    if(!dStr) return null;
                    const d = new Date(dStr);
                    return ((d - minDate) / (1000*60*60*24)) * pxPerDay;
                };
                const getWidth = (sStr, eStr) => {
                    if(!sStr || !eStr) return 0;
                    const s = new Date(sStr); const e = new Date(eStr);
                    return Math.max(0, (e - s) / (1000*60*60*24)) * pxPerDay;
                };
                const pL = getLeft(p.pStart); const pW = getWidth(p.pStart, p.pEnd);
                const rL = getLeft(p.rStart); const rW = getWidth(p.rStart, p.rEnd);
                const customColor = p.color || DEFAULT_COLOR;
                return `
                    <div class="gantt-row">
                        <div class="gantt-info">${p.name}</div>
                        <div class="gantt-track">
                            ${(pL!==null && pW>0) ? `<div class="bar-plan" style="left:${pL}px; width:${pW}px; background:${customColor}; opacity:0.15"></div>` : ''}
                            ${(rL!==null && rW>0) ? `<div class="bar-real" style="left:${rL}px; width:${rW}px; background:${customColor}; box-shadow: 0 0 8px ${customColor}55"></div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        window.onload = () => { applyLang(); renderDecide(); };
    </script>
</body>
</html>
